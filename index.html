<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>稲さんマネー AIレシート</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#17191c}
main{max-width:720px;margin:auto;padding:16px 14px 80px}.hero{background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;border-radius:20px;padding:20px;margin-bottom:12px}
.card{background:#fff;border-radius:17px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.muted{font-size:12px;color:#777;line-height:1.6}
input,select{width:100%;padding:12px;border:1px solid #d9dce1;border-radius:12px;font-size:15px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#2563eb;color:#fff;font-weight:800;margin-top:10px}
.type{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.type button{padding:14px;border:2px solid #ddd;background:#fff;border-radius:13px;font-weight:800}.type button.sel{border-color:#2563eb;background:#eef3ff;color:#174ea6}
.item{border:1px solid #e4e7eb;border-radius:13px;padding:12px;margin-top:9px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.ok{color:#118346;font-weight:800}.warn{color:#b45309;font-weight:800}
#review{display:none}.status{padding:11px;border-radius:12px;background:#eef3ff;color:#174ea6;font-size:12px;margin-top:10px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head>
<body><main>
<div class="hero"><div style="font-size:12px;color:#dbeafe">AI画像解析版</div><h1 style="margin:5px 0">💰 稲さんマネー</h1><div>📸 レシート → 🧠 AI → 🧾 確認</div></div>
<div class="card"><h2 style="margin-top:0">📸 レシートを撮影</h2><div class="muted">写真そのものをAIに渡して、店舗・日付・商品名・金額・カテゴリを整理します。</div>
<input id="photo" type="file" accept="image/*" capture="environment" style="margin-top:12px"><div id="status" class="status" style="display:none"></div></div>
<div id="review" class="card"><h2 style="margin-top:0">🤖 読み取り結果を確認</h2>
<div class="grid"><div><div class="muted">店舗</div><input id="shop"></div><div><div class="muted">日付</div><input id="date" type="date"></div>
<div><div class="muted">合計</div><input id="total" type="number"></div><div><div class="muted">点数</div><input id="count" type="number"></div></div>
<div class="type"><button class="sel" data-use="house">🏠 家計</button><button data-use="buy">📦 仕入れ</button></div>
<div id="items"></div><div id="check" style="margin-top:12px"></div>
<button class="btn" id="save">この内容で登録</button></div>
</main>
<script>
let use="house", result=null;
const $=id=>document.getElementById(id);
document.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{use=b.dataset.use;document.querySelectorAll("[data-use]").forEach(x=>x.classList.toggle("sel",x===b));render()});
function render(){
 if(!result)return;
 $("shop").value=result.shop||"";$("date").value=result.date||"";$("total").value=result.total||"";$("count").value=result.count||"";
 $("items").innerHTML=(result.items||[]).map((x,i)=>`<div class=item><div class=grid><input data-n="${i}" value="${(x.name||"").replaceAll('"','&quot;')}"><input data-p="${i}" type=number value="${x.price||0}"></div>
 <select data-c="${i}" style="margin-top:8px">${["食費","日用品","車","住居","光熱費","趣味","医療","仕入れ","その他"].map(c=>`<option ${x.category===c?"selected":""}>${c}</option>`).join("")}</select></div>`).join("");
 document.querySelectorAll("[data-n]").forEach(e=>e.oninput=()=>result.items[e.dataset.n].name=e.value);
 document.querySelectorAll("[data-p]").forEach(e=>e.oninput=()=>{result.items[e.dataset.p].price=+e.value;check()});
 document.querySelectorAll("[data-c]").forEach(e=>e.onchange=()=>result.items[e.dataset.c].category=e.value);
 check();
}
function check(){
 if(!result)return;
 const sum=(result.items||[]).reduce((a,x)=>a+Number(x.price||0),0), total=Number(result.total||0);
 const diff=sum-total;
 $("check").innerHTML= total && Math.abs(diff)<=1 ? `<div class="ok">✅ 商品合計とレシート合計が一致しました（¥${total.toLocaleString()}）</div>` :
 `<div class="warn">⚠️ 商品合計 ¥${sum.toLocaleString()} / レシート合計 ¥${total.toLocaleString()}${total?`（差額 ¥${diff.toLocaleString()}）`:""}</div>`;
}
$("photo").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 $("status").style.display="block";$("status").textContent="🤖 レシートをAIで解析中…";
 const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});
 try{
   const res=await fetch("/api/receipt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:data})});
   const json=await res.json(); if(!res.ok) throw new Error(json.error||"解析に失敗しました");
   result=json; $("review").style.display="block"; $("status").textContent="✅ 解析完了。内容を確認してね。"; render();
 }catch(err){$("status").textContent="⚠️ "+err.message}
};
$("save").onclick=()=>alert("確認済みデータを登録する処理をここに接続します。");
</script></body></html>
